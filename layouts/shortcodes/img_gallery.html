{{ $folder := .Get "folder" }}
{{ $images := resources.Match (printf "%s/*.{jpg,jpeg,png,webp}" $folder) }}

<div class="container">
    <div class="gallery">
        {{ range $images }}
        <a href="{{ .RelPermalink }}" class="glightbox gallery-item">
            <span class="gallery-zoom">
                <img src="{{ .RelPermalink }}" alt="{{ .Name | plainify }}" class="img-fluid" />
            </span>
        </a>
        {{ end }}
    </div>
</div>

<style>
    .gallery {
        column-count: 3;
        column-gap: 16px;
    }

    .gallery-item {
        display: inline-block;
        width: 100%;
        margin-bottom: 16px;
        break-inside: avoid;
        border-radius: 8px;
        overflow: hidden;
        background: #f4f4f4;
        outline: none; 
    }

    .gallery-item:focus {
        outline: none;
    }

    .gallery-item:focus-visible {
        outline: 2px solid rgba(0, 0, 0, 0.3); 
        outline-offset: 2px;
    }

    .gallery-zoom {
        display: block;
        overflow: hidden;
        border-radius: 8px;
    }

    .gallery img {
        display: block;
        width: 100%;
        height: auto;
        opacity: 0;
        animation: fadeIn 0.5s ease forwards;
        transition: transform 0.25s ease;
    }

    .gallery-zoom img {
        transform: scale(1.03);
    }

    @keyframes fadeIn {
        to {
            opacity: 1;
        }
    }

    @media (max-width: 992px) {
        .gallery {
            column-count: 3;
        }
    }

    @media (max-width: 768px) {
        .gallery {
            column-count: 2;
            column-gap: 12px;
        }
        .gallery-item {
            margin-bottom: 12px;
        }
    }

    @media (max-width: 576px) {
        .gallery {
            column-count: 1;
        }
    }

    .glightbox-open {
        height: auto;
    }
</style>

<script>
    const lightbox = GLightbox({
        selector: '.glightbox',
        scrollLock: false,
        openEffect: 'fade' 
    });
</script>
